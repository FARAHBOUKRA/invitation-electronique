<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --rose:#f6dfe3; --ink:#5b3a45; --gold:#b98a5e; --paper:#fff8f6;
  --btn-bg:rgba(255,248,246,.88); --btn-ink:#5b3a45;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:#e9c9d2;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
.stage{position:fixed;inset:0;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
#cta{
  position:absolute;left:50%;bottom:calc(11% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  padding:.9rem 2.4rem;border:1px solid var(--gold);border-radius:999px;
  background:var(--btn-bg);color:var(--btn-ink);
  font:italic 600 1.55rem/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;cursor:pointer;
  box-shadow:0 6px 24px rgba(120,60,80,.28);
  animation:pulse 2.2s ease-in-out infinite;transition:opacity .5s,transform .5s;
}
#cta:hover{background:#fff}
#cta:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
#cta.gone{opacity:0;pointer-events:none;transform:translateX(-50%) scale(.9);animation:none}
@keyframes pulse{0%,100%{box-shadow:0 6px 24px rgba(120,60,80,.28),0 0 0 0 rgba(185,138,94,.5)}50%{box-shadow:0 6px 24px rgba(120,60,80,.28),0 0 0 14px rgba(185,138,94,0)}}
@media (prefers-reduced-motion:reduce){#cta{animation:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <video id="v" playsinline webkit-playsinline preload="auto" poster="poster.jpg" src="video2.mp4"></video>
  <button id="cta" type="button">Clic ici</button>
</main>

<script src="player.js"></script>
<script>
(function(){
  var v=document.getElementById('v'), cta=document.getElementById('cta');
  var TARGET_PAGE='inv2.html';
  var started=false;
  cta.addEventListener('click',function(){
    if(started) return; started=true;
    cta.classList.add('gone');
    WeddingMusic.start();
    v.muted=true; v.currentTime=0;
    var pr=v.play();
    if(pr&&pr.catch) pr.catch(function(){started=false;cta.classList.remove('gone');WeddingMusic.stop();});
  });
  v.addEventListener('ended',function(){ window.location.href=TARGET_PAGE; });
})();
</script>
</body>
